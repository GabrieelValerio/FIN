<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena - Fin</title>
  <link rel="icon" type="image/png" href="assets/icons/icon.png?v=2">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="pagina">
    <p><a href="inicio.html">← Início</a></p>
    <h1 id="titulo">Arena</h1>
    <p><small id="sub"></small></p>
    <button id="btnEncerrar" class="perigo" hidden>Encerrar arena</button>
    <p id="msg"></p>
    <div id="cards"></div>
  </main>

  <script type="module">
    import { aoMudarLogin, getArena, escutarArena, encerrarArena, limparMinhaPresenca } from "./db.js";

    const LIMITE_PV = 0.3;
    const $ = (id) => document.getElementById(id);
    const el = (tag, texto) => { const e = document.createElement(tag); if (texto) e.textContent = texto; return e; };
    const id = new URLSearchParams(location.search).get("id");
    let timer, parar;

    function linha(nome, r, temTemp, cor) {
      const d = el("div");
      d.className = "recurso";
      if (["pv", "pc", "pe", "pf"].includes(cor)) d.classList.add("alerta");
      if (["pv", "pc", "pe"].includes(cor)) d.classList.add("pisca");
      const pct = r.total > 0 ? (r.atual / r.total) * 100 : 100;
      if (r.total > 0 && pct < 50) d.classList.add("meio");
      if (r.total > 0 && pct <= 25) d.classList.add("critico");
      const barra = el("div"), preenche = el("i");
      barra.className = "barra r-" + cor;
      preenche.style.width = (r.total > 0 ? Math.max(0, Math.min(100, pct)) : 0) + "%";
      barra.append(preenche);
      d.append(el("span", nome + " " + r.atual + "/" + r.total + (temTemp && r.temp ? " (+" + r.temp + ")" : "")), barra);
      return d;
    }

    // Só os pontos: nada de ficha
    function card(p) {
      const div = el("div");
      div.className = "card";
      if (p.pv && p.pv.total > 0 && p.pv.atual / p.pv.total <= LIMITE_PV) div.classList.add("baixo");
      div.append(el("h3", p.nome + (p.donoNome ? " - " + p.donoNome : "")));
      div.append(linha("PV", p.pv, true, "pv"), linha("PE", p.pe, false, "pe"), linha("PC", p.pc, false, "pc"));
      if (p.ps && p.ps.total > 0) div.append(linha("PS", p.ps, false, "ps"));
      if (p.cb && p.cb.total > 0) div.append(linha("CB", p.cb, false, "cb"));
      if (p.pf) div.append(linha("PF", p.pf, false, "pf"));
      if (p.pv && p.pv.total > 0 && p.pv.atual <= 0) {
        const n = p.morrendo || 0;
        const aviso = el("div", n >= 3 ? "MORTO" : "MORRENDO " + n + "/3");
        aviso.className = "morrendo-aviso";
        div.append(aviso);
        if (n >= 3) div.classList.add("morto");
      }
      return div;
    }

    function desenhar(lista) {
      lista.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
      $("msg").textContent = lista.length ? "" : "Ninguém na arena ainda. Passe o código aos jogadores.";
      $("cards").replaceChildren(...lista.map(card));
    }

    function encerrou(texto) {
      clearInterval(timer);
      if (parar) parar();
      $("cards").replaceChildren();
      $("sub").textContent = "";
      $("btnEncerrar").hidden = true;
      $("msg").textContent = texto;
    }

    const hms = (ms) => {
      const s = Math.max(0, Math.floor(ms / 1000));
      return [Math.floor(s / 3600), Math.floor((s % 3600) / 60), s % 60].map((n) => String(n).padStart(2, "0")).join(":");
    };

    aoMudarLogin(async (user) => {
      if (!user) { location.href = "login.html?volta=" + encodeURIComponent(location.pathname.split("/").pop() + location.search); return; }
      try {
        const arena = await getArena(id);
        if (!arena) {
          await limparMinhaPresenca(id).catch(() => {});
          encerrou("Esta arena não existe mais.");
          return;
        }
        $("titulo").textContent = arena.nome;
        const ehCriador = arena.criadorUid === user.uid;
        const fim = arena.expiraEm.toMillis();

        const finalizar = async (texto) => {
          if (ehCriador) await encerrarArena(arena.id, arena.codigo).catch(() => {});
          await limparMinhaPresenca(arena.id).catch(() => {});
          encerrou(texto);
        };

        if (fim <= Date.now()) { await finalizar("Esta arena terminou (passou de 3 horas)."); return; }

        $("btnEncerrar").hidden = !ehCriador;
        $("btnEncerrar").onclick = async () => {
          if (!confirm("Encerrar a arena agora? Os pontos dos participantes deixam de aparecer.")) return;
          try { await encerrarArena(arena.id, arena.codigo); location.href = "inicio.html"; }
          catch (e) { $("msg").textContent = "Erro: " + e.message; }
        };

        const atualizarRelogio = () => {
          const resta = fim - Date.now();
          if (resta <= 0) { finalizar("A arena terminou (3 horas)."); return; }
          $("sub").textContent = "Código: " + arena.codigo + " · termina em " + hms(resta);
        };
        atualizarRelogio();
        timer = setInterval(atualizarRelogio, 1000);

        parar = escutarArena(arena.id, desenhar, (e) => { $("msg").textContent = "Erro: " + e.message; });
      } catch (e) { $("msg").textContent = "Erro: " + e.message; }
    });
  </script>
</body>
</html>
