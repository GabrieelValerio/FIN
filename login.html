<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar - Fin</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="pagina cartao">
    <p><a href="index.html">← Voltar</a></p>
    <h2 id="tituloForm">Entrar</h2>
    <p><input id="nomeConta" placeholder="Nome de usuário" hidden></p>
    <p><input id="email" type="email" placeholder="E-mail"></p>
    <p><input id="senha" type="password" placeholder="Senha (mínimo 6 caracteres)"></p>
    <button id="btnEmail" class="principal">Entrar</button>
    <button id="btnTrocar" type="button">Criar uma conta</button>
    <button id="btnRecuperar" type="button">Esqueci a senha</button>
    <hr>
    <button id="btnEntrar">Entrar com Google</button>
    <p id="msg"></p>
  </main>

  <script type="module">
    import { entrar, aoMudarLogin, cadastrarEmail, entrarEmail, recuperarSenha } from "./db.js";

    const $ = (id) => document.getElementById(id);
    const msg = (t) => { $("msg").textContent = t; };
    const ERROS = {
      "auth/email-already-in-use": "Esse e-mail já tem uma conta.",
      "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
      "auth/invalid-email": "E-mail inválido.",
      "auth/invalid-credential": "E-mail ou senha incorretos.",
      "auth/missing-password": "Digite a senha.",
      "auth/popup-closed-by-user": "Login cancelado."
    };
    async function tentar(fn) {
      try { msg(""); await fn(); }
      catch (e) { ocupado = false; msg("Erro: " + (ERROS[e.code] || e.message)); }
    }

    let criando = false, ocupado = false;
    aoMudarLogin((user) => { if (user && !ocupado) location.href = "inicio.html"; });

    $("btnTrocar").onclick = () => {
      criando = !criando;
      $("tituloForm").textContent = criando ? "Criar conta" : "Entrar";
      $("btnEmail").textContent = criando ? "Cadastrar" : "Entrar";
      $("btnTrocar").textContent = criando ? "Já tenho conta" : "Criar uma conta";
      $("nomeConta").hidden = !criando;
    };
    $("btnEmail").onclick = () => tentar(async () => {
      if (criando) {
        ocupado = true; // espera o nome de usuário ser gravado antes de ir para o início
        await cadastrarEmail($("email").value, $("senha").value, $("nomeConta").value);
        location.href = "inicio.html";
      } else {
        await entrarEmail($("email").value, $("senha").value);
      }
    });
    $("btnRecuperar").onclick = () => tentar(async () => {
      if (!$("email").value.trim()) throw new Error("Digite o e-mail acima primeiro.");
      await recuperarSenha($("email").value);
      msg("Enviamos um e-mail para redefinir a senha (veja também o spam).");
    });
    $("btnEntrar").onclick = () => tentar(entrar);
  </script>
</body>
</html>
