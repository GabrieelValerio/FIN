<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel ao vivo</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="pagina">
    <p><a href="inicio.html">← Início</a></p>
    <h1 id="titulo">Painel</h1>
    <button id="btnRenomear" hidden>Renomear campanha</button>

    <div class="abas">
      <button id="abaSessao" class="ativo">Em sessão</button>
      <button id="abaTodos">Todos</button>
    </div>
    <p id="msg"></p>

    <div id="cards"></div>

    <div id="todos" hidden>
      <button id="btnAtualizar">Atualizar lista</button>
      <ul id="listaTodos"></ul>
    </div>
  </main>

  <script type="module">
    import { aoMudarLogin, getCampanha, listarCampanha, setSessao, escutarVivo, renomearCampanha, desvincularPersonagem } from "./db.js";

    const LIMITE_PV = 0.3; // card fica vermelho quando PV atual <= 30% do total
    const $ = (id) => document.getElementById(id);
    const el = (tag, texto) => { const e = document.createElement(tag); if (texto) e.textContent = texto; return e; };
    const id = new URLSearchParams(location.search).get("id");
    const nomeDe = (p) => p.nome + (p.donoNome ? " - " + p.donoNome : "");
    const erro = (e) => { $("msg").textContent = "Erro: " + e.message; };

    let c, ouvindo = {}, dados = {};

    // ----- Em sessão: só estes têm escuta ao vivo -----
    function linha(nome, r, temTemp, cor) {
      const d = el("div");
      d.className = "recurso";
      const barra = el("div"), preenche = el("i");
      barra.className = "barra r-" + cor;
      preenche.style.width = (r.total > 0 ? Math.max(0, Math.min(100, r.atual / r.total * 100)) : 0) + "%";
      barra.append(preenche);
      d.append(el("span", nome + " " + r.atual + "/" + r.total + (temTemp && r.temp ? " (+" + r.temp + ")" : "")), barra);
      return d;
    }

    function card(p) {
      const div = el("div");
      div.className = "card";
      if (p.pv && p.pv.total > 0 && p.pv.atual / p.pv.total <= LIMITE_PV) div.classList.add("baixo");
      div.append(el("h3", nomeDe(p)));
      div.append(linha("PV", p.pv, true, "pv"), linha("PE", p.pe, false, "pe"), linha("PC", p.pc, false, "pc"));
      if (p.ps && p.ps.total > 0) div.append(linha("PS", p.ps, false, "ps"));
      if (p.cb && p.cb.total > 0) div.append(linha("CB", p.cb, false, "cb"));
      if (p.pf) div.append(linha("PF", p.pf, false, "pf"));
      const a = el("a", "Abrir ficha");
      a.href = "personagem.html?id=" + p.id;
      div.append(a);
      return div;
    }

    function desenharSessao() {
      const lista = Object.values(dados).sort((a, b) => a.nome.localeCompare(b.nome));
      $("msg").textContent = lista.length ? "" : "Ninguém em sessão. Marque os personagens na aba Todos.";
      $("cards").replaceChildren(...lista.map(card));
    }

    function sincronizarOuvintes() {
      const ids = new Set(c.sessao || []);
      Object.keys(ouvindo).forEach((k) => {
        if (!ids.has(k)) { ouvindo[k](); delete ouvindo[k]; delete dados[k]; }
      });
      ids.forEach((k) => {
        if (ouvindo[k]) return;
        ouvindo[k] = escutarVivo(k, (d) => { dados[k] = { id: k, ...d }; desenharSessao(); }, () => {
          // personagem apagado ou desvinculado: sai da sessão
          c.sessao = c.sessao.filter((x) => x !== k);
          setSessao(id, c.sessao).catch(() => {});
          sincronizarOuvintes();
        });
      });
      desenharSessao();
    }

    // ----- Todos: só nomes, sem vida -----
    async function carregarTodos() {
      const todos = (await listarCampanha(id)).sort((a, b) => a.nome.localeCompare(b.nome));
      $("listaTodos").replaceChildren(...todos.map((p) => {
        const li = el("li");
        const cb = el("input");
        cb.type = "checkbox";
        cb.checked = (c.sessao || []).includes(p.id);
        cb.onchange = async () => {
          const set = new Set(c.sessao || []);
          if (cb.checked) set.add(p.id); else set.delete(p.id);
          c.sessao = [...set];
          try { await setSessao(id, c.sessao); sincronizarOuvintes(); } catch (e) { erro(e); }
        };
        const rem = el("button", "Remover da campanha");
        rem.className = "perigo";
        rem.onclick = async () => {
          if (!confirm("Remover " + p.nome + " da campanha?")) return;
          try {
            await desvincularPersonagem(p.id);
            c.sessao = (c.sessao || []).filter((x) => x !== p.id);
            await setSessao(id, c.sessao);
            sincronizarOuvintes();
            await carregarTodos();
          } catch (e) { erro(e); }
        };
        li.append(cb, " " + nomeDe(p) + " ", rem);
        return li;
      }));
      if (!todos.length) $("listaTodos").replaceChildren(el("li", "Nenhum personagem vinculado ainda. Passe o código de convite aos jogadores."));
    }

    function aba(qual) {
      $("cards").hidden = qual !== "sessao";
      $("todos").hidden = qual !== "todos";
      $("abaSessao").classList.toggle("ativo", qual === "sessao");
      $("abaTodos").classList.toggle("ativo", qual === "todos");
      if (qual === "todos") carregarTodos().catch(erro);
    }
    $("abaSessao").onclick = () => aba("sessao");
    $("abaTodos").onclick = () => aba("todos");
    $("btnAtualizar").onclick = () => carregarTodos().catch(erro);

    aoMudarLogin(async (user) => {
      if (!user) { location.href = "login.html"; return; }
      try {
        c = await getCampanha(id);
        if (!c) throw new Error("Campanha não encontrada.");
        const mostrar = () => { $("titulo").textContent = c.nome + " - código " + c.codigo; };
        mostrar();
        $("btnRenomear").hidden = false;
        $("btnRenomear").onclick = async () => {
          const nome = prompt("Novo nome da campanha:", c.nome);
          if (nome === null) return;
          try { await renomearCampanha(c.id, c.codigo, nome); c.nome = nome.trim(); mostrar(); } catch (e) { erro(e); }
        };
        sincronizarOuvintes();
      } catch (e) { erro(e); }
    });
  </script>
</body>
</html>
